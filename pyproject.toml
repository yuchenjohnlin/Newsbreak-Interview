[project]
name = "topic-page-generator"
version = "0.1.0"
description = "One-sentence event description -> a structured, cited HTML topic page."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",        # data contract: validation + types in one place
    "jinja2>=3",          # deterministic schema -> HTML rendering
    "python-dotenv>=1",   # load API keys from .env
    "httpx>=0.27",        # HTTP client (LLM / search calls)
    "anthropic>=0.40",    # LLM provider (default; swappable)
    # search / research API client: TBD — e.g. `tavily-python` (see docs/decisions/)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
